<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Games Collection</title>
  <meta name="description" content="A curated collection of browser games">
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#0ea5a4;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#071028 0%,#08102a 60%);color:#e6eef8}
    header{display:flex;align-items:center;justify-content:space-between;padding:28px 32px;border-bottom:1px solid rgba(255,255,255,0.03)}
    .brand{display:flex;gap:16px;align-items:center}
    .logo{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),#06b6d4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#042630}
    h1{margin:0;font-size:20px}
    p.lead{margin:0;color:var(--muted);font-size:13px}
    .controls{display:flex;gap:12px;align-items:center}
    input.search{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);padding:10px 12px;border-radius:10px;color:inherit;width:260px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:28px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:14px;border-radius:12px;display:flex;gap:12px;align-items:center;transition:transform .18s ease,box-shadow .18s}
    .card:hover{transform:translateY(-6px);box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    .thumb{width:72px;height:72px;border-radius:8px;flex-shrink:0;background:#061124;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:18px;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .meta{flex:1}
    .name{font-size:16px;margin:0 0 6px}
    .meta .meta-muted{color:var(--muted);font-size:13px}
    footer{padding:24px 32px;color:var(--muted);font-size:13px}
    @media (max-width:560px){.controls{flex-direction:column;align-items:start}input.search{width:100%}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">G</div>
      <div>
        <h1>Games Collection</h1>
        <p class="lead">Imported from gamesite-for-me — click a card to play</p>
      </div>
    </div>
    <div class="controls">
      <input id="q" class="search" placeholder="Search games..." aria-label="Search games">
    </div>
  </header>

  <main>
    <div id="grid" class="grid">
<!-- CARDS -->
    </div>
  </main>

  <footer>Auto-generated gallery — customize on the repository branch.</footer>

  <script>
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const games = [];
  </script>
</body>
</html>

<script>
function render() {
  grid.innerHTML = '';
  const qv = (q.value || '').toLowerCase().trim();
  for (const g of games) {
    if (qv && g.name.toLowerCase().indexOf(qv) === -1) continue;
    const a = document.createElement('a');
    a.href = g.path;
    a.className = 'card';

    const t = document.createElement('div');
    t.className = 'thumb';
    if (g.thumb) {
      const img = document.createElement('img');
      img.src = g.thumb;
      img.alt = g.name;
      t.appendChild(img);
    } else {
      t.textContent = g.name.charAt(0).toUpperCase();
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('h3');
    name.className = 'name';
    name.textContent = g.name;
    const sub = document.createElement('div');
    sub.className = 'meta-muted';
    sub.textContent = 'Play now';
    meta.appendChild(name);
    meta.appendChild(sub);

    a.appendChild(t);
    a.appendChild(meta);
    grid.appendChild(a);
  }
}

q.addEventListener('input', render);
render();
</script>
